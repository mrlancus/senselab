name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build

  preview:
    # Uploads a preview version (not promoted to production) with a per-PR URL.
    # Skipped on forks and until the Cloudflare secrets are configured.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; skipping preview deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ok == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile && pnpm build
      - if: steps.secrets.outputs.ok == 'true'
        id: upload
        working-directory: apps/api
        run: |
          out=$(pnpm exec wrangler versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --var "APP_VERSION:${GITHUB_SHA::7}-pr${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} ${GITHUB_SHA::7}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.secrets.outputs.ok == 'true' && steps.upload.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- senselab-preview -->';
            const body = `${marker}\nPreview: ${{ steps.upload.outputs.url }} (commit ${context.sha.slice(0, 7)})\n\nPreviews share the production D1 database and R2 bucket.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
